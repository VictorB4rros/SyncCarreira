name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Source/synccarreira-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Source/synccarreira-frontend
        run: npm ci

      - name: Build frontend
        working-directory: Source/synccarreira-frontend
        run: npm run build

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Garantir permissao no gradlew
        run: chmod +x Source/synccarreira-api/gradlew

      - name: Build and analyze
        working-directory: Source/synccarreira-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew test jacocoTestReport sonar --info
          -Dsonar.projectKey=synccarreira
          -Dsonar.organization=synccarreira
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectBaseDir=${{ github.workspace }}
          -Dsonar.sources=Source/synccarreira-api/src/main/java,Source/synccarreira-frontend/src
          -Dsonar.tests=Source/synccarreira-api/src/test/java
          -Dsonar.coverage.jacoco.xmlReportPaths=Source/synccarreira-api/build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.coverage.exclusions="**/config/**,**/entities/**,**/dto/**,**/services/exceptions/**,**/controllers/handlers/**,Source/synccarreira-frontend/**"
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
          -Dsonar.qualitygate.wait=true
